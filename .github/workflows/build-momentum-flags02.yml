name: Build Momentum Xiaomi True JustWorks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-momentum-flags02.yml"
      - "tools/patch_momentum_flags02.py"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FlipMiRemote
        uses: actions/checkout@v4
        with:
          path: FlipMiRemote

      - name: Checkout Momentum firmware
        uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          ref: dev
          submodules: recursive
          path: Momentum-Firmware

      - name: Patch Xiaomi advertising and true JustWorks
        working-directory: Momentum-Firmware
        run: |
          python3 "$GITHUB_WORKSPACE/FlipMiRemote/tools/patch_momentum_flags02.py"
          git diff --check
          git diff -- targets/f7/ble_glue/gap.c

      - name: Add FlipMiRemote app
        run: |
          ln -s "$GITHUB_WORKSPACE/FlipMiRemote" "$GITHUB_WORKSPACE/Momentum-Firmware/applications_user/flipmiremote"

      - name: Build Xiaomi true JustWorks updater and FAP
        working-directory: Momentum-Firmware
        run: |
          ./fbt updater_minpackage fap_flipmiremote

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find Momentum-Firmware/dist -type f \( -name "*.tgz" -o -name "*.dfu" \) -print -exec cp {} dist/ \;
          find Momentum-Firmware/build -type f -name "flipmiremote.fap" -print -exec cp {} dist/ \;
          test -f dist/flipmiremote.fap
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.tgz' -o -name '*.dfu' \) -print -quit)"

      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: FlipMiRemote-Momentum-Xiaomi-TrueJustWorks
          path: dist/*
          if-no-files-found: error
